name: Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Convert owner name to lowercase
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Create shared network # temporary before kubernetes I think
        run: |
          docker network create connecthub-network || true

      - name: Pull backend Image
        run: |
          docker pull ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:latest

      - name: Stop existing backend container
        run: |
          docker stop connecthub || true
          docker rm connecthub || true

      - name: Run new backend container
        run: |
          docker run -d --name connecthub --network connecthub-network -p 8080:8080 ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}:latest

      - name: Pull frontend Image
        run: |
          docker pull ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}-frontend:latest

      - name: Stop existing frontend container
        run: |
          docker stop connecthub-frontend || true
          docker rm connecthub-frontend || true

      - name: Run new frontend container
        run: |
          docker run -d --name connecthub-frontend --network connecthub-network -p 5173:80 ghcr.io/${{ env.OWNER_LC }}/${{ github.event.repository.name }}-frontend:latest
